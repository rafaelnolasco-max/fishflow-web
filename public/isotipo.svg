<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FishFlow">
  <title>FishFlow — Isotipo</title>
  <defs>
    <!--
      Tide gradient — cyan current crossing into warm life.
      The midpoint passes through a desaturated warm-neutral, never grey.
    -->
    <linearGradient id="ff-tide" x1="14%" y1="50%" x2="86%" y2="50%">
      <stop offset="0%"   stop-color="#1FA9D6"/>
      <stop offset="40%"  stop-color="#3DB3CE"/>
      <stop offset="50%"  stop-color="#C7AE82" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#F0A14A"/>
      <stop offset="100%" stop-color="#F26B17"/>
    </linearGradient>
  </defs>

  <!--
    Lemniscate, traced as a single self-crossing path with diagonal
    tangents at the centre — the X crossing reads as the tapered waist
    where the fish body meets the tail. No explicit fin is drawn:
    the geometry itself does the work.
  -->
  <path d="
    M 600 300
    C 760 100, 1000  90, 1000 300
    C 1000 510,  760 500, 600 300
    C 440 100,  200  90,  200 300
    C 200 510,  440 500,  600 300 Z"
    fill="none"
    stroke="url(#ff-tide)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!--
    A single quiet eye on the head of the fish (right side of right lobe).
    This is the only explicit fish element — every other suggestion of life
    comes from colour temperature and the tapering of the X.
  -->
  <circle cx="880" cy="278" r="9" fill="#0C3445" opacity="0.55"/>
</svg>
