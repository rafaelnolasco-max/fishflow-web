<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Pérgola de madera">
  <defs>
    <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D3A2D"/><stop offset="100%" stop-color="#2E5E48"/>
    </linearGradient>
    <linearGradient id="pwood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0B061"/><stop offset="100%" stop-color="#C08F3C"/>
    </linearGradient>
    <linearGradient id="pwood2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B4823A"/><stop offset="100%" stop-color="#96692C"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#psky)"/>
  <!-- vegetación de fondo -->
  <g opacity=".28" fill="#0E211A">
    <path d="M40 262 L74 156 L108 262 Z"/><rect x="68" y="260" width="12" height="26"/>
    <path d="M540 266 L572 170 L604 266 Z"/><rect x="566" y="264" width="12" height="26"/>
    <circle cx="150" cy="240" r="34"/><circle cx="492" cy="246" r="30"/>
  </g>
  <!-- piso -->
  <path d="M110 292 L530 292 L604 372 L36 372 Z" fill="#B98C42"/>
  <g stroke="#0E211A" stroke-opacity=".18" stroke-width="2">
    <path d="M180 292 L128 372"/><path d="M250 292 L220 372"/><path d="M320 292 L320 372"/>
    <path d="M390 292 L420 372"/><path d="M460 292 L512 372"/>
  </g>
  <!-- postes -->
  <rect x="128" y="120" width="16" height="176" rx="3" fill="url(#pwood2)"/>
  <rect x="496" y="120" width="16" height="176" rx="3" fill="url(#pwood2)"/>
  <rect x="196" y="132" width="12" height="162" rx="3" fill="url(#pwood2)" opacity=".8"/>
  <rect x="432" y="132" width="12" height="162" rx="3" fill="url(#pwood2)" opacity=".8"/>
  <!-- vigas principales -->
  <rect x="112" y="104" width="416" height="16" rx="4" fill="url(#pwood)"/>
  <rect x="112" y="122" width="416" height="7" rx="2" fill="#8A6228" opacity=".55"/>
  <!-- travesaños del techo -->
  <g fill="url(#pwood)">
    <rect x="140" y="84" width="10" height="24" rx="2"/>
    <rect x="180" y="84" width="10" height="24" rx="2"/>
    <rect x="220" y="84" width="10" height="24" rx="2"/>
    <rect x="260" y="84" width="10" height="24" rx="2"/>
    <rect x="300" y="84" width="10" height="24" rx="2"/>
    <rect x="340" y="84" width="10" height="24" rx="2"/>
    <rect x="380" y="84" width="10" height="24" rx="2"/>
    <rect x="420" y="84" width="10" height="24" rx="2"/>
    <rect x="460" y="84" width="10" height="24" rx="2"/>
  </g>
  <rect x="104" y="76" width="432" height="11" rx="4" fill="url(#pwood2)"/>
  <!-- sombra proyectada en el piso -->
  <g opacity=".16" fill="#0E211A">
    <rect x="176" y="300" width="14" height="66"/><rect x="216" y="300" width="14" height="66"/>
    <rect x="256" y="300" width="14" height="66"/><rect x="296" y="300" width="14" height="66"/>
    <rect x="336" y="300" width="14" height="66"/><rect x="376" y="300" width="14" height="66"/>
    <rect x="416" y="300" width="14" height="66"/>
  </g>
  <!-- mesa y macetas -->
  <g>
    <ellipse cx="320" cy="258" rx="58" ry="14" fill="#7C5A26"/>
    <rect x="316" y="258" width="8" height="34" fill="#6B4E20"/>
    <rect x="298" y="288" width="44" height="7" rx="3" fill="#6B4E20"/>
    <path d="M164 296 l8 -30 h26 l8 30 z" fill="#8A6228"/>
    <circle cx="185" cy="258" r="16" fill="#3A7458"/>
    <path d="M448 296 l8 -30 h26 l8 30 z" fill="#8A6228"/>
    <circle cx="469" cy="258" r="16" fill="#3A7458"/>
  </g>
</svg>
