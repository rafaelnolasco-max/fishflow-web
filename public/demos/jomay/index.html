  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"a863a578-4108-4422-8ee1-bb1c510e53e2\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"16d4ca5c-7916-4228-a944-b2058d26abe5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"db2aadec-d919-4baf-ab5f-84a971c4a4a3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  :root{\n    --cream:#F2ECE2;\n    --cream-2:#EDE6DB;\n    --paper:#FAF6EE;\n    --ink:#1C1813;\n    --ink-2:#3B342D;\n    --muted:#8A7E73;\n    --rose:#B59285;       /* dusty mauve from logo underline */\n    --rose-deep:#8E6B5F;\n    --rule:#D9CFC1;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}\n  body{font-family:\"Jost\",system-ui,sans-serif;font-weight:300;font-size:16px;line-height:1.6;letter-spacing:.01em}\n  img{max-width:100%;display:block}\n  a{color:inherit;text-decoration:none}\n  .display{font-family:\"Italiana\",serif;font-weight:400;letter-spacing:.04em;line-height:.95}\n  .serif{font-family:\"Cormorant Garamond\",serif}\n  .eyebrow{font-family:\"Jost\",sans-serif;font-weight:400;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--rose-deep)}\n  .container{max-width:1320px;margin:0 auto;padding:0 56px}\n\n  /* ------------------- NAV ------------------- */\n  .nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:rgba(242,236,226,.78);border-bottom:1px solid transparent;transition:.4s}\n  .nav.scrolled{border-bottom-color:var(--rule)}\n  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 56px}\n  .nav-mark{display:flex;align-items:baseline;gap:10px;font-family:\"Italiana\",serif;font-size:18px;letter-spacing:.34em}\n  .nav-mark .dot{display:inline-block;width:6px;height:6px;background:var(--rose);transform:rotate(45deg);margin:0 4px 0 0;position:relative;top:-2px}\n  .nav-links{display:flex;gap:42px;font-size:12px;letter-spacing:.22em;text-transform:uppercase}\n  .nav-links a{position:relative;padding:6px 0}\n  .nav-links a:hover{color:var(--rose-deep)}\n  .nav-cta{font-size:11px;letter-spacing:.28em;text-transform:uppercase;padding:12px 22px;border:1px solid var(--ink);transition:.3s}\n  .nav-cta:hover{background:var(--ink);color:var(--paper)}\n\n  /* ------------------- HERO ------------------- */\n  .hero{position:relative;padding:170px 0 90px;overflow:hidden}\n  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;align-items:end}\n  .hero-meta{display:flex;align-items:center;gap:18px;margin-bottom:30px}\n  .hero-meta .bar{width:54px;height:1px;background:var(--rose-deep)}\n  .hero h1{font-size:clamp(64px,9vw,156px);margin:0 0 8px;color:var(--ink)}\n  .hero h1 .italic{font-family:\"Cormorant Garamond\",serif;font-style:italic;font-weight:300;letter-spacing:.005em;color:var(--rose-deep)}\n  .hero-lead{max-width:440px;margin-top:36px;font-size:17px;line-height:1.7;color:var(--ink-2)}\n  .hero-cta-row{display:flex;align-items:center;gap:28px;margin-top:44px}\n  .btn-primary{display:inline-flex;align-items:center;gap:14px;padding:18px 30px;background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:.28em;text-transform:uppercase;transition:.3s}\n  .btn-primary:hover{background:var(--rose-deep)}\n  .btn-primary svg{width:14px;height:14px}\n  .btn-ghost{font-size:12px;letter-spacing:.28em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:6px}\n  .btn-ghost:hover{color:var(--rose-deep);border-bottom-color:var(--rose-deep)}\n\n  /* hero figure: portrait-style image card with brand stamp */\n  .hero-figure{position:relative;aspect-ratio:1/1;background:#F5F0E7;display:flex;align-items:center;justify-content:center}\n  .hero-figure .logo-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}\n  .hero-figure img.logo{width:88%;height:auto;display:block;mix-blend-mode:multiply}\n  .hero-figure::before{content:\"\";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%, rgba(255,255,255,0) 0%, rgba(229,217,201,.35) 100%);pointer-events:none}\n  .hero-figure .stamp,.hero-figure .corner{z-index:2}\n  .hero-figure .stamp{position:absolute;bottom:-28px;right:-28px;background:var(--paper);border:1px solid var(--rule);padding:18px 22px;width:200px}\n  .hero-figure .stamp .eyebrow{margin-bottom:6px}\n  .hero-figure .stamp .num{font-family:\"Italiana\",serif;font-size:42px;line-height:1;color:var(--ink)}\n  .hero-figure .stamp .label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}\n  .hero-figure .corner{position:absolute;top:18px;left:18px;font-family:\"Italiana\",serif;font-size:14px;letter-spacing:.34em;color:rgba(28,24,19,.55);writing-mode:vertical-rl;transform:rotate(180deg)}\n\n  /* metrics strip */\n  .metrics{margin-top:120px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}\n  .metrics > div{padding:34px 28px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}\n  .metrics > div:last-child{border-right:none}\n  .metrics .n{font-family:\"Italiana\",serif;font-size:48px;line-height:1}\n  .metrics .l{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}\n\n  /* ornament */\n  .ornament{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--rose-deep)}\n  .ornament .line{width:80px;height:1px;background:var(--rose-deep)}\n  .ornament .diamond{width:9px;height:9px;background:var(--rose-deep);transform:rotate(45deg)}\n\n  /* ------------------- SECTION SHELL ------------------- */\n  section{padding:140px 0;position:relative}\n  .section-head{display:grid;grid-template-columns:240px 1fr;gap:60px;margin-bottom:80px;align-items:end}\n  .section-head h2{font-size:clamp(48px,5vw,80px);line-height:.98}\n  .section-head h2 .italic{font-family:\"Cormorant Garamond\",serif;font-style:italic;font-weight:300;color:var(--rose-deep)}\n  .section-head .kicker .eyebrow{margin-bottom:14px;display:block}\n  .section-head .kicker p{color:var(--ink-2);max-width:34ch}\n\n  /* ------------------- ABOUT ------------------- */\n  .about{background:var(--paper)}\n  .about-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:90px;align-items:center}\n  .about-figure{position:relative;aspect-ratio:3/4}\n  .about-figure .ph{position:absolute;inset:0;background:\n    repeating-linear-gradient(110deg,rgba(142,107,95,.10) 0 2px,transparent 2px 22px),\n    linear-gradient(180deg,#E6DBCB 0%,#D2C0AB 100%);\n    display:flex;align-items:flex-end;padding:24px}\n  .about-figure small{font-family:\"JetBrains Mono\",ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(28,24,19,.5)}\n  .about-figure .sig{position:absolute;top:-22px;left:-22px;background:var(--cream);padding:14px 20px;font-family:\"Cormorant Garamond\",serif;font-style:italic;font-size:22px;color:var(--ink)}\n  .about-body h3{font-family:\"Italiana\",serif;font-size:54px;line-height:1.05;margin-bottom:28px}\n  .about-body h3 .italic{font-family:\"Cormorant Garamond\",serif;font-style:italic;font-weight:300;color:var(--rose-deep)}\n  .about-body p{color:var(--ink-2);margin-bottom:18px;max-width:48ch}\n  .about-creds{margin-top:38px;display:grid;grid-template-columns:repeat(2,max-content);gap:24px 60px;border-top:1px solid var(--rule);padding-top:30px}\n  .about-creds .label{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}\n  .about-creds .val{font-family:\"Italiana\",serif;font-size:22px;margin-top:4px}\n\n  /* ------------------- SERVICES ------------------- */\n  .services-list{border-top:1px solid var(--ink)}\n  .service-row{display:grid;grid-template-columns:120px 1fr 1.2fr 200px;gap:40px;align-items:center;padding:38px 0;border-bottom:1px solid var(--rule);position:relative;transition:.4s}\n  .service-row:hover{background:var(--paper);padding-left:18px}\n  .service-row .num{display:flex;align-items:baseline;gap:6px;color:var(--ink)}\n  .service-row .num .prefix{font-family:\"Jost\",sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}\n  .service-row .num .digits{font-family:\"Cormorant Garamond\",serif;font-style:italic;font-weight:400;font-size:42px;line-height:1;color:var(--rose-deep)}\n  .service-row .name{font-family:\"Italiana\",serif;font-size:34px;line-height:1.05}\n  .service-row .desc{color:var(--ink-2);font-size:15px;max-width:42ch}\n  .service-row .price{display:flex;flex-direction:column;align-items:flex-end;gap:4px}\n  .service-row .price .from{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}\n  .service-row .price .amount{font-family:\"Italiana\",serif;font-size:30px}\n  .service-row .arrow{position:absolute;right:0;top:50%;transform:translate(40px,-50%);opacity:0;transition:.4s;color:var(--rose-deep);font-family:\"Italiana\",serif;font-size:24px}\n  .service-row:hover .arrow{transform:translate(0,-50%);opacity:1}\n\n  /* ------------------- SIGNATURE / PROCESS ------------------- */\n  .signature{background:var(--ink);color:var(--paper)}\n  .signature .eyebrow )}\n  .foot-bottom{border-top:1px solid var(--rule);padding-top:24px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);gap:24px;flex-wrap:wrap}\n  .made-by{display:inline-flex;align-items:center;gap:14px;padding:8px 14px;border:1px solid var(--rule);background:var(--paper);transition:.3s}\n  .made-by:hover{border-color:var(--ink);color:var(--ink)}\n  .made-by .made-label{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}\n  .made-by .ff-logo{height:18px;width:auto;display:block;opacity:.95}\n  .made-by .made-url{font-size:11px;letter-spacing:.18em;text-transform:lowercase;color:var(--ink-2);border-left:1px solid var(--rule);padding-left:14px;font-family:\"Jost\",sans-serif}\n  .made-by:hover .made-url{color:var(--rose-deep)}\n\n  /* ------------------- SVG eye motif (echo of logo, decorative) ------------------- */\n  .eye-motif{position:absolute;opacity:.06;pointer-events:none}\n\n  @media (max-width: 900px){\n    .container{padding:0 24px}\n    .nav-inner{padding:14px 24px}\n    .nav-links{display:none}\n    .hero{padding:130px 0 60px}\n    .hero-grid,.about-grid,.visit-grid{grid-template-columns:1fr;gap:60px}\n    .section-head{grid-template-columns:1fr;gap:24px}\n    .metrics{grid-template-columns:repeat(2,1fr)}\n    .metrics > div:nth-child(2){border-right:none}\n    .metrics > div:nth-child(1),.metrics > div:nth-child(2){border-bottom:1px solid var(--rule)}\n    .service-row{grid-template-columns:50px 1fr;gap:14px}\n    .service-row .desc,.service-row .price{grid-column:2}\n    .service-row .price{align-items:flex-start}\n    .signature-grid,.quote-grid{grid-template-columns:1fr;gap:40px}\n    .foot-grid{grid-template-columns:1fr 1fr;gap:40px}\n    section{padding:90px 0}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ============== NAV ============== -->\n<nav class=\"nav\" id=\"nav\">\n  <div class=\"nav-inner\">\n    <a href=\"#\" class=\"nav-mark\">\n      <span class=\"dot\"><\u002Fspan>\n      STUDIO JOMAY\n    <\u002Fa>\n    <div class=\"nav-links\">\n      <a href=\"#filosofia\">Filosofía<\u002Fa>\n      <a href=\"#servicios\">Servicios<\u002Fa>\n      <a href=\"#galeria\">Galería<\u002Fa>\n      <a href=\"#opiniones\">Opiniones<\u002Fa>\n      <a href=\"#visitar\">Visitar<\u002Fa>\n    <\u002Fdiv>\n    <a href=\"#visitar\" class=\"nav-cta\">Agendar Cita<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ============== HERO ============== -->\n<section class=\"hero\" id=\"inicio\">\n  <div class=\"container\">\n    <div class=\"hero-grid\">\n      <div class=\"hero-text\">\n        <div class=\"hero-meta\">\n          <span class=\"bar\"><\u002Fspan>\n          <span class=\"eyebrow\">Brows &amp; Beauty · CDMX · est. 2018<\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"display\">\n          Belleza<br>\n          que <span class=\"italic\">transforma<\u002Fspan><br>\n          la mirada.\n        <\u002Fh1>\n        <p class=\"hero-lead\">\n          Micropigmentación de cejas pelo a pelo, lashlift y faciales firmados por Mayra. Diseño hecho a la medida de tu rostro — técnica artística, resultados armoniosos, presencia natural.\n        <\u002Fp>\n        <div class=\"hero-cta-row\">\n          <a href=\"#visitar\" class=\"btn-primary\">\n            Agendar Cita\n            <svg viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"><path d=\"M1 7h12M8 2l5 5-5 5\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n          <a href=\"#servicios\" class=\"btn-ghost\">Ver servicios<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hero-figure\">\n        <div class=\"logo-wrap\"><img class=\"logo\" src=\"e09a1534-3bac-4b81-9351-93d3c5067b54\" alt=\"Studio JOMAY — Brows &amp; Beauty\"><\u002Fdiv>\n        <div class=\"corner\">JOMAY · MMXXVI<\u002Fdiv>\n        <div class=\"stamp\">\n          <div class=\"eyebrow\">Firma de la casa<\u002Fdiv>\n          <div class=\"num\">N° 01<\u002Fdiv>\n          <div class=\"label\">Micropigmentación Pelo&nbsp;a&nbsp;Pelo<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"metrics\">\n      <div><div class=\"n\">1,500+<\u002Fdiv><div class=\"l\">Miradas transformadas<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"n\">8 años<\u002Fdiv><div class=\"l\">De experiencia clínica<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"n\">4.9 / 5<\u002Fdiv><div class=\"l\">Calificación Google<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"n\">100%<\u002Fdiv><div class=\"l\">Pigmentos hipoalergénicos<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== ABOUT / FILOSOFÍA ============== -->\n<section class=\"about\" id=\"filosofia\">\n  <div class=\"container\">\n    <div class=\"section-head\">\n      <div><span class=\"eyebrow\">Sobre la casa<\u002Fspan><\u002Fdiv>\n      <div class=\"kicker\">\n        <div class=\"ornament\" style=\"justify-content:flex-start;margin-bottom:14px\"><span class=\"line\"><\u002Fspan><span class=\"diamond\"><\u002Fspan><\u002Fdiv>\n        <p>Un estudio íntimo en Colonia Álamos donde cada cita comienza con una conversación — nunca con una técnica.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"about-grid\">\n      <div class=\"about-figure\">\n        <div class=\"sig\">— Mayra<\u002Fdiv>\n        <div class=\"ph\"><small>placeholder · retrato Mayra en estudio<\u002Fsmall><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"about-body\">\n        <h3>Una mirada<br><span class=\"italic\">no se copia<\u002Fspan>, se diseña.<\u002Fh3>\n        <p>Mayra fundó Studio JOMAY con una convicción simple: las cejas son arquitectura facial. No son una tendencia, no son un molde, no son una plantilla. Son la línea que sostiene la expresión.<\u002Fp>\n        <p>Cada sesión inicia con un estudio del óvalo, la asimetría natural, la dirección del pelo y el tono de piel. Después viene el diseño — trazado a mano, aprobado por ti — y solo entonces, el pigmento.<\u002Fp>\n        <div class=\"about-creds\">\n          <div><div class=\"label\">Certificación<\u002Fdiv><div class=\"val\">Pigmentación Avanzada · MX<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"label\">Especialidad<\u002Fdiv><div class=\"val\">Técnica Pelo a Pelo<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"label\">Pigmentos<\u002Fdiv><div class=\"val\">Veganos · Hipoalergénicos<\u002Fdiv><\u002Fdiv>\n          <div><div class=\"label\">Higiene<\u002Fdiv><div class=\"val\">Protocolo ISO Estética<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== SERVICES ============== -->\n<section id=\"servicios\">\n  <div class=\"container\">\n    <div class=\"section-head\">\n      <div><span class=\"eyebrow\">El menú<\u002Fspan><\u002Fdiv>\n      <div class=\"kicker\">\n        <h2 class=\"display\">Servicios<br><span class=\"italic\">de la casa<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"services-list\">\n      <a href=\"#visitar\" class=\"service-row\">\n        <div class=\"num\"><span class=\"prefix\">Nº<\u002Fspan><span class=\"digits\">01<\u002Fspan><\u002Fdiv>\n        <div class=\"name\">Micropigmentación de Cejas<\u002Fdiv>\n        <div class=\"desc\">Técnica pelo a pelo con diseño personalizado. Cejas que se adaptan al rostro, simulan vello real y duran de 12 a 18 meses con retoque incluido.<\u002Fdiv>\n        <div class=\"price\"><span class=\"from\">Desde<\u002Fspan><span class=\"amount\">$4,800<\u002Fspan><\u002Fdiv>\n        <span class=\"arrow\">→<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#visitar\" class=\"service-row\">\n        <div class=\"num\"><span class=\"prefix\">Nº<\u002Fspan><span class=\"digits\">02<\u002Fspan><\u002Fdiv>\n        <div class=\"name\">Lashlift &amp; Tinte<\u002Fdiv>\n        <div class=\"desc\">Levantamiento natural de la pestaña con keratina. Realza la mirada sin extensiones, sin mantenimiento diario. Duración 6 a 8 semanas.<\u002Fdiv>\n        <div class=\"price\"><span class=\"from\">Desde<\u002Fspan><span class=\"amount\">$850<\u002Fspan><\u002Fdiv>\n        <span class=\"arrow\">→<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#visitar\" class=\"service-row\">\n        <div class=\"num\"><span class=\"prefix\">Nº<\u002Fspan><span class=\"digits\">03<\u002Fspan><\u002Fdiv>\n        <div class=\"name\">Depilación 3D Hilo<\u002Fdiv>\n        <div class=\"desc\">Diseño geométrico con hilo: precisión milimétrica, máxima limpieza del contorno, ideal antes de cualquier evento o sesión de pigmentación.<\u002Fdiv>\n        <div class=\"price\"><span class=\"from\">Desde<\u002Fspan><span class=\"amount\">$280<\u002Fspan><\u002Fdiv>\n        <span class=\"arrow\">→<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#visitar\" class=\"service-row\">\n        <div class=\"num\"><span class=\"prefix\">Nº<\u002Fspan><span class=\"digits\">04<\u002Fspan><\u002Fdiv>\n        <div class=\"name\">Facial Firma JOMAY<\u002Fdiv>\n        <div class=\"desc\">Protocolo de 60 minutos. Limpieza profunda, exfoliación enzimática, masaje kobido y mascarilla luminosa. Pensado para piel mexicana.<\u002Fdiv>\n        <div class=\"price\"><span class=\"from\">Desde<\u002Fspan><span class=\"amount\">$1,400<\u002Fspan><\u002Fdiv>\n        <span class=\"arrow\">→<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#visitar\" class=\"service-row\">\n        <div class=\"num\"><span class=\"prefix\">Nº<\u002Fspan><span class=\"digits\">05<\u002Fspan><\u002Fdiv>\n        <div class=\"name\">Retoque Anual<\u002Fdiv>\n        <div class=\"desc\">Mantenimiento para clientas con pigmentación previa. Refresca color, ajusta forma, conserva la naturalidad del trabajo original.<\u002Fdiv>\n        <div class=\"price\"><span class=\"from\">Desde<\u002Fspan><span class=\"amount\">$1,800<\u002Fspan><\u002Fdiv>\n        <span class=\"arrow\"
