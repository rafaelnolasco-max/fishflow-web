<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FishFlow · Módulo de Citas (demo)</title>
<meta name="description" content="Demo del módulo de auto-agenda de FishFlow: tus clientes reservan solos, 24/7. Reskin por negocio." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1) RESPONSIVE BASE  ·  bloque base (idéntico a _template)
   ============================================================ */
*{box-sizing:border-box;}
*,*::before,*::after{min-width:0;}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;}
img,svg,video,canvas,iframe{max-width:100%;}
img,svg,video{display:block;height:auto;}
.ff-container{width:100%;max-width:var(--ff-max,1100px);margin-inline:auto;padding-inline:var(--ff-pad,clamp(18px,4vw,56px));}
.ff-grid{display:grid;gap:var(--ff-gap,18px);grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--ff-min,240px)),1fr));}
.ff-grid--sm{--ff-min:150px;}
.ff-grid--md{--ff-min:240px;}
.ff-grid--lg{--ff-min:300px;}
.ff-tablewrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.ff-h1{font-size:clamp(30px,5vw,52px);line-height:1.04;letter-spacing:-.02em;}
.ff-h2{font-size:clamp(22px,3.2vw,34px);line-height:1.08;letter-spacing:-.02em;}
.ff-lede{font-size:clamp(15px,1.4vw,18px);line-height:1.55;}
@media(max-width:600px){
  :root{--ff-pad:18px;}
  .ff-hide-mobile{display:none !important;}
  .ff-grid{--ff-gap:14px;}
}

/* ============================================================
   2) TOKENS  ·  --brand se reasigna por cliente vía JS
   ============================================================ */
:root{
  --brand:#B59285; --brand-ink:#1C1813; --accent:#D6B2A4;
  --paper:#FFFFFF; --paper-2:#F6F2EC; --line:#E7DFD5; --muted:#6B6259;
  --f-display:"Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Inter",system-ui,sans-serif;
  --ff-max:1100px;
}
body{font-family:var(--f-body);background:var(--paper-2);color:var(--brand-ink);-webkit-font-smoothing:antialiased;line-height:1.5;}
h1,h2,h3{font-family:var(--f-display);margin:0;}
a{color:inherit;text-decoration:none;}
.btn{font-family:var(--f-body);font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;border:1px solid transparent;display:inline-flex;align-items:center;gap:9px;cursor:pointer;transition:transform .15s,opacity .15s,background .15s;}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn--primary{background:var(--brand);color:#fff;}
.btn--ghost{background:transparent;color:var(--brand-ink);border-color:var(--line);}

/* ---- Barra demo FishFlow ---- */
.demobar{background:#0D1B2A;color:#fff;}
.demobar__in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:10px;flex-wrap:wrap;}
.demobar .lbl{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;}
.demobar .lbl .dot{width:22px;height:22px;border-radius:6px;background:#FF8C35;display:grid;place-items:center;font-size:12px;font-weight:800;font-family:var(--f-display);}
.demobar .lbl .tag{font-weight:500;color:#9FB1BF;}
.switch{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;}
.switch button{font-family:var(--f-body);font-size:13px;font-weight:600;color:#cbd6df;background:transparent;border:0;padding:7px 14px;border-radius:999px;cursor:pointer;}
.switch button[aria-pressed="true"]{background:#fff;color:#0D1B2A;}

/* ---- Encabezado del negocio ---- */
.biz{background:var(--paper);border-bottom:1px solid var(--line);}
.biz__in{padding-block:clamp(26px,4vw,46px);}
.biz .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700;}
.biz h1{margin:10px 0 8px;}
.biz p{color:var(--muted);max-width:54ch;margin:0;}
.biz .meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;font-size:13.5px;color:var(--muted);}
.biz .meta b{color:var(--brand-ink);font-weight:600;}

/* ---- Wizard ---- */
.wrap{padding-block:clamp(26px,4vw,48px);}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.steps .s{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 13px;}
.steps .s .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--paper-2);color:var(--muted);border:1px solid var(--line);}
.steps .s.is-active{color:var(--brand-ink);border-color:var(--brand);}
.steps .s.is-active .n{background:var(--brand);color:#fff;border-color:var(--brand);}
.steps .s.is-done .n{background:var(--brand);color:#fff;border-color:var(--brand);}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px);}
.panel h2{margin-bottom:4px;}
.panel .hint{color:var(--muted);font-size:14px;margin:0 0 20px;}

/* opción seleccionable (servicio) */
.opt{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px;}
.opt:hover{border-color:var(--brand);}
.opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in oklab,var(--brand) 35%,transparent);}
.opt .t{font-family:var(--f-display);font-weight:700;font-size:16px;}
.opt .d{font-size:13px;color:var(--muted);}
.opt .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:13.5px;}
.opt .dur{color:var(--muted);}
.opt .price{font-weight:700;color:var(--brand-ink);}

/* chips fecha / hora */
.chips{display:flex;flex-wrap:wrap;gap:10px;}
.chip{font-family:var(--f-body);font-size:14px;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;color:var(--brand-ink);transition:border-color .15s;text-align:center;min-width:64px;}
.chip:hover{border-color:var(--brand);}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:11px;}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand);}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8);}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through;}

/* formulario */
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
.field input,.field textarea{width:100%;font-family:var(--f-body);font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--paper-2);color:var(--brand-ink);}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand);background:var(--paper);}

/* resumen / confirmación */
.summary{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
.summary .r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14.5px;border-bottom:1px dashed var(--line);}
.summary .r:last-child{border-bottom:0;}
.summary .r span:first-child{color:var(--muted);}
.summary .r span:last-child{font-weight:600;text-align:right;}
.done-ico{width:66px;height:66px;border-radius:50%;background:color-mix(in oklab,var(--brand) 16%,transparent);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px;font-size:32px;}
.perks{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
.perk{display:flex;gap:12px;align-items:flex-start;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;}
.perk .ic{font-size:18px;flex-shrink:0;}
.perk .tt{font-weight:600;font-size:14px;}
.perk .dd{font-size:13px;color:var(--muted);}
.perk--ai{border-color:var(--brand);background:color-mix(in oklab,var(--brand) 8%,var(--paper));}

.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;}

.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;}
.foot{background:#0D1B2A;color:#9FB1BF;}
.foot__in{padding-block:26px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:13px;align-items:center;}
.foot .dot{width:20px;height:20px;border-radius:6px;background:#FF8C35;display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:#fff;font-family:var(--f-display);}
</style>
</head>
<body>

<!-- BARRA DEMO + SWITCHER DE CLIENTE -->
<header class="demobar">
  <div class="demobar__in ff-container">
    <span class="lbl"><span class="dot">F</span> Módulo de Citas <span class="tag">· demo en vivo</span></span>
    <div class="switch" role="group" aria-label="Cambiar de negocio">
      <button id="sw-jomay" onclick="setClient('jomay')">Studio Jomay</button>
      <button id="sw-cane" onclick="setClient('cane')">CANE</button>
    </div>
  </div>
</header>

<!-- ENCABEZADO DEL NEGOCIO (se rellena por JS) -->
<section class="biz">
  <div class="biz__in ff-container">
    <span class="eyebrow" id="biz-eyebrow"></span>
    <h1 class="ff-h1" id="biz-name"></h1>
    <p class="ff-lede" id="biz-tagline"></p>
    <div class="meta" id="biz-meta"></div>
  </div>
</section>

<!-- WIZARD -->
<main class="wrap">
  <div class="ff-container">
    <div class="steps" id="steps"></div>
    <div class="panel" id="panel"></div>
    <p class="note">Demo interactivo · datos de ejemplo. Construido por FishFlow — el módulo real guarda cada cita en el panel del negocio en tiempo real.</p>
  </div>
</main>

<footer class="foot">
  <div class="foot__in ff-container">
    <span><span class="dot">F</span> &nbsp;Módulo de Citas — FishFlow</span>
    <span>Un solo motor · se adapta a cada negocio · PC · iPad · móvil ✓</span>
  </div>
</footer>

<script>
/* ============================================================
   CONFIG POR CLIENTE — esto es lo único que cambia por negocio.
   En producción vive en Supabase (catálogo + horario por client_id).
   ============================================================ */
const CLIENTS = {
  jomay: {
    eyebrow: "Studio Jomay · Micropigmentación & Faciales",
    name: "Agenda tu cita en Studio Jomay",
    tagline: "Elige tu servicio, día y hora. Recibes confirmación al instante — sin llamadas, sin esperas.",
    brand: "#B59285", brandInk: "#1C1813", accent: "#D6B2A4",
    paper: "#FFFFFF", paper2: "#F6F2EC", line: "#E7DFD5", muted: "#6B6259",
    location: "Col. Del Valle, CDMX",
    days: [2,3,4,5,6],            // Mar–Sáb
    open: "10:00", close: "18:00",
    services: [
      { t:"Micropigmentación de cejas (pelo a pelo)", d:"Diseño + aplicación completa", dur:120, price:2800 },
      { t:"Retoque de cejas", d:"Mantenimiento sobre trabajo previo", dur:60, price:900 },
      { t:"Limpieza facial profunda", d:"Hidratación y extracción", dur:75, price:750 },
      { t:"Lifting de pestañas", d:"Curvatura natural duradera", dur:60, price:650 },
    ],
  },
  cane: {
    eyebrow: "CANE · Centro de Aprendizaje Neuronal",
    name: "Agenda tu sesión en CANE",
    tagline: "Reserva tu sesión de neurofeedback o tu evaluación en línea. Confirmación inmediata y recordatorios automáticos.",
    brand: "#2D7DAA", brandInk: "#1A2733", accent: "#E08864",
    paper: "#FFFFFF", paper2: "#F1F6FA", line: "#DCE6EC", muted: "#5A6B77",
    location: "Consultorio · CDMX",
    days: [1,2,3,4,5],            // Lun–Vie
    open: "09:00", close: "19:00",
    services: [
      { t:"Sesión de neurofeedback", d:"Entrenamiento cerebral guiado", dur:60, price:850 },
      { t:"Evaluación inicial (mapeo QEEG)", d:"Diagnóstico y plan de trabajo", dur:90, price:1500 },
      { t:"Terapia de seguimiento", d:"Sesión de avance", dur:50, price:700 },
      { t:"Consulta de orientación", d:"Primera plática informativa", dur:45, price:600 },
    ],
  },
};

const DOW = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MON = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const STEP_LABELS = ["Servicio","Fecha","Hora","Tus datos","Listo"];

let CK = "jomay";                                  // cliente activo
let state = { step:0, service:null, date:null, time:null, data:{} };

/* deterministic pseudo-random para marcar horarios "ocupados" igual en cada visita */
function seeded(n){ let x = Math.sin(n)*10000; return x - Math.floor(x); }

function applyBrand(c){
  const r = document.documentElement.style;
  r.setProperty("--brand", c.brand);
  r.setProperty("--brand-ink", c.brandInk);
  r.setProperty("--accent", c.accent);
  r.setProperty("--paper", c.paper);
  r.setProperty("--paper-2", c.paper2);
  r.setProperty("--line", c.line);
  r.setProperty("--muted", c.muted);
}

function setClient(key){
  CK = key;
  const c = CLIENTS[key];
  applyBrand(c);
  document.getElementById("biz-eyebrow").textContent = c.eyebrow;
  document.getElementById("biz-name").textContent = c.name;
  document.getElementById("biz-tagline").textContent = c.tagline;
  document.getElementById("biz-meta").innerHTML =
    `<span>📍 <b>${c.location}</b></span>`+
    `<span>🗓️ <b>${c.days.map(d=>DOW[d]).join(" · ")}</b></span>`+
    `<span>🕘 <b>${c.open}–${c.close}</b></span>`;
  document.getElementById("sw-jomay").setAttribute("aria-pressed", key==="jomay");
  document.getElementById("sw-cane").setAttribute("aria-pressed", key==="cane");
  state = { step:0, service:null, date:null, time:null, data:{} };
  render();
}

function fmtPrice(n){ return "$"+n.toLocaleString("es-MX"); }
function fmtDate(d){ return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; }

/* genera próximos días hábiles del negocio */
function upcomingDates(c, count){
  const out=[]; const d=new Date(); d.setHours(0,0,0,0);
  let guard=0;
  while(out.length<count && guard<60){
    d.setDate(d.getDate()+1);
    if(c.days.includes(d.getDay())) out.push(new Date(d));
    guard++;
  }
  return out;
}

/* genera horarios según horario del negocio y duración del servicio */
function slotsFor(c, date, durMin){
  const [oh,om]=c.open.split(":").map(Number);
  const [ch,cm]=c.close.split(":").map(Number);
  const closeMin = ch*60 + (cm||0);
  const slots=[]; let h=oh, m=om;
  while(h*60+m < closeMin){
    const mins = h*60+m;
    if(mins+durMin <= closeMin){            // solo si el servicio cabe antes del cierre
      const seed = date.getDate()*100 + h*4 + m/15;
      const taken = seeded(seed) < 0.32;    // ~1/3 ocupados, consistente por día
      slots.push({ label:`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`, taken });
    }
    m+=30; if(m>=60){m=0;h++;}
  }
  return slots;
}

function renderSteps(){
  const el=document.getElementById("steps");
  el.innerHTML = STEP_LABELS.map((l,i)=>{
    const cls = i===state.step ? "is-active" : (i<state.step ? "is-done":"");
    const inner = i<state.step ? "✓" : (i+1);
    return `<span class="s ${cls}"><span class="n">${inner}</span>${l}</span>`;
  }).join("");
}

function render(){
  const c = CLIENTS[CK];
  renderSteps();
  const p = document.getElementById("panel");

  // PASO 1 — SERVICIO
  if(state.step===0){
    p.innerHTML = `<h2 class="ff-h2">Elige tu servicio</h2>
      <p class="hint">Toca el servicio que quieres agendar.</p>
      <div class="ff-grid ff-grid--md" id="svc"></div>`;
    const g=p.querySelector("#svc");
    g.innerHTML = c.services.map((s,i)=>`
      <button class="opt" aria-pressed="${state.service===i}" onclick="pickService(${i})">
        <span class="t">${s.t}</span>
        <span class="d">${s.d}</span>
        <span class="row"><span class="dur">⏱ ${s.dur} min</span><span class="price">${fmtPrice(s.price)}</span></span>
      </button>`).join("");
    return;
  }

  // PASO 2 — FECHA
  if(state.step===1){
    const dates = upcomingDates(c, 14);
    p.innerHTML = `<h2 class="ff-h2">Elige el día</h2>
      <p class="hint">Disponibilidad real del negocio: ${c.days.map(d=>DOW[d]).join(", ")}.</p>
      <div class="chips" id="dts"></div>
      <div class="actions"><button class="btn btn--ghost" onclick="go(0)">← Atrás</button></div>`;
    p.querySelector("#dts").innerHTML = dates.map((d,i)=>{
      const iso=d.toISOString().slice(0,10);
      return `<button class="chip" aria-pressed="${state.date===iso}" onclick="pickDate('${iso}',${d.getTime()})">
        ${DOW[d.getDay()]}<small>${d.getDate()} ${MON[d.getMonth()]}</small></button>`;
    }).join("");
    return;
  }

  // PASO 3 — HORA
  if(state.step===2){
    const d=new Date(state.dateMs);
    const slots=slotsFor(c, d, c.services[state.service].dur);
    p.innerHTML = `<h2 class="ff-h2">Elige la hora</h2>
      <p class="hint">${fmtDate(d)} · ${c.services[state.service].t} (${c.services[state.service].dur} min)</p>
      <div class="chips" id="hrs"></div>
      <div class="actions"><button class="btn btn--ghost" onclick="go(1)">← Atrás</button></div>`;
    p.querySelector("#hrs").innerHTML = slots.map(s=>`
      <button class="chip" ${s.taken?"disabled":""} aria-pressed="${state.time===s.label}" onclick="pickTime('${s.label}')">${s.label}</button>`).join("");
    return;
  }

  // PASO 4 — DATOS
  if(state.step===3){
    p.innerHTML = `<h2 class="ff-h2">Tus datos</h2>
      <p class="hint">Para confirmarte la cita y enviarte el recordatorio.</p>
      <div class="field"><label>Nombre completo</label><input id="f-name" value="${state.data.name||""}" placeholder="Tu nombre"></div>
      <div class="field"><label>WhatsApp / teléfono</label><input id="f-phone" value="${state.data.phone||""}" placeholder="55 0000 0000"></div>
      <div class="field"><label>Correo (para tu .ics y comprobante)</label><input id="f-email" value="${state.data.email||""}" placeholder="tucorreo@ejemplo.com"></div>
      <div class="field"><label>Nota (opcional)</label><textarea id="f-note" rows="2" placeholder="Algo que debamos saber">${state.data.note||""}</textarea></div>
      <div class="actions">
        <button class="btn btn--ghost" onclick="go(2)">← Atrás</button>
        <button class="btn btn--primary" id="confirm" onclick="confirmBooking()">Confirmar cita <span>→</span></button>
      </div>`;
    return;
  }

  // PASO 5 — CONFIRMACIÓN
  if(state.step===4){
    const c2=CLIENTS[CK], s=c2.services[state.service], d=new Date(state.dateMs);
    p.innerHTML = `
      <div class="done-ico">✓</div>
      <h2 class="ff-h2" style="text-align:center">¡Cita agendada!</h2>
      <p class="hint" style="text-align:center">${state.data.name||"Tu cita"}, te esperamos. Esto es lo que sigue.</p>
      <div class="summary">
        <div class="r"><span>Negocio</span><span>${c2.eyebrow.split("·")[0].trim()}</span></div>
        <div class="r"><span>Servicio</span><span>${s.t}</span></div>
        <div class="r"><span>Fecha y hora</span><span>${fmtDate(d)} · ${state.time}</span></div>
        <div class="r"><span>Duración</span><span>${s.dur} min</span></div>
        <div class="r"><span>Total estimado</span><span>${fmtPrice(s.price)}</span></div>
      </div>
      <div class="perks">
        <div class="perk"><span class="ic">📧</span><div><div class="tt">Confirmación + archivo .ics</div><div class="dd">Te llega al correo para que la cita entre sola a tu calendario (Apple / Google).</div></div></div>
        <div class="perk"><span class="ic">💬</span><div><div class="tt">Recordatorio por WhatsApp</div><div class="dd">Un aviso automático un día antes para que no se te pase.</div></div></div>
        <div class="perk perk--ai"><span class="ic">📞</span><div><div class="tt">Llamada de confirmación con voz IA</div><div class="dd">Una llamada con voz natural confirma o reagenda tu cita por ti — sin que el negocio levante el teléfono.</div></div></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn btn--ghost" onclick="restart()">Agendar otra cita</button>
      </div>`;
    return;
  }
}

/* ---- handlers ---- */
function go(step){ state.step=step; render(); }
function pickService(i){ state.service=i; render(); setTimeout(()=>go(1),180); }
function pickDate(iso,ms){ state.date=iso; state.dateMs=ms; render(); setTimeout(()=>go(2),180); }
function pickTime(t){ state.time=t; render(); setTimeout(()=>go(3),180); }
function confirmBooking(){
  state.data = {
    name: (document.getElementById("f-name").value||"").trim(),
    phone: (document.getElementById("f-phone").value||"").trim(),
    email: (document.getElementById("f-email").value||"").trim(),
    note: (document.getElementById("f-note").value||"").trim(),
  };
  if(!state.data.name){ alert("Escribe tu nombre para confirmar."); return; }
  go(4);
}
function restart(){ setClient(CK); }

/* arranque: lee ?c=jomay|cane */
